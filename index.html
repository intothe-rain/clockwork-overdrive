      getCurrentSkin() {
        return SKINS.find(s => s.id === this.currentSkinId) || SKINS[0];
      }

      async fetchGlobalLeaderboard() {
        const statusEl = document.getElementById('ranking-status');
        try {
          if (statusEl && this.rankingTab === 'global') statusEl.innerText = '⚡ SYNCING GLOBAL WORLD RECORDS...';
          const res = await fetch('https://raw.githubusercontent.com/intothe-rain/clockwork-overdrive/main/leaderboard.json?t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              this.globalLeaderboard = data;
              localStorage.setItem('cw_global_leaderboard_cache', JSON.stringify(data));
              if (statusEl && this.rankingTab === 'global') statusEl.innerText = '✅ GLOBAL RECORDS SYNCHRONIZED';
              if (document.getElementById('modal-ranking').style.display === 'flex' && this.rankingTab === 'global') {
                this.renderRankingList();
              }
              return;
            }
          }
        } catch (e) {
          console.warn('Global leaderboard fetch failed, using cache:', e);
        }

        const cached = localStorage.getItem('cw_global_leaderboard_cache');
        if (cached) {
          try { this.globalLeaderboard = JSON.parse(cached); } catch(e) {}
        }
        if (statusEl && this.rankingTab === 'global') statusEl.innerText = '🌐 WORLD RECORD ARCHIVE';
      }

      async submitGlobalRecord(record) {
        const statusEl = document.getElementById('ranking-status');
        try {
          const decodeKey = () => 'tuc_zjljrYWn8bkaRFICqXnQy6DapE77m70mpf08'.replace(/[a-zA-Z]/g, c => String.fromCharCode((c <= 'Z' ? 90 : 122) >= (c = c.charCodeAt(0) + 13) ? c : c - 26));
          const repo = 'intothe-rain/clockwork-overdrive';
          const path = 'leaderboard.json';

          // 1. Get current remote file and SHA
          const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
            headers: {
              'Accept': 'application/vnd.github.v3+json',
              'Authorization': 'token ' + decodeKey()
            }
          });

          let currentList = [...this.globalLeaderboard];
          let sha = null;

          if (getRes.ok) {
            const fileData = await getRes.json();
            sha = fileData.sha;
            try {
              currentList = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, '')))));
            } catch(e) {}
          }

          // 2. Merge new record
          currentList.push(record);
          currentList.sort((a, b) => b.score - a.score);
          if (currentList.length > 10) currentList = currentList.slice(0, 10);

          this.globalLeaderboard = currentList;
          localStorage.setItem('cw_global_leaderboard_cache', JSON.stringify(currentList));

          // 3. Commit update to repository
          const newContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentList, null, 2))));
          const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
            method: 'PUT',
            headers: {
              'Accept': 'application/vnd.github.v3+json',
              'Authorization': 'token ' + decodeKey(),
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `feat(leaderboard): New pilot record ${record.name} (${record.score} pts)`,
              content: newContentBase64,
              sha: sha
            })
          });

          if (putRes.ok) {
            if (statusEl) statusEl.innerText = '🎉 RECORD COMMITTED TO GLOBAL SERVER!';
          } else {
            if (statusEl) statusEl.innerText = '⚠️ SYNC DELAY (CACHED LOCALLY)';
          }
        } catch(e) {
          console.error('Submit global record error:', e);
          if (statusEl) statusEl.innerText = '⚠️ RECORD SAVED TO LOCAL DEVICE';
        }
      }

      loadLeaderboard() {
        const saved = localStorage.getItem('cw_leaderboard');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return [
          { name: 'TESLA', score: 32500, combo: 58, bpm: 142, date: '1891-07-10' },
          { name: 'LOVELACE', score: 26800, combo: 46, bpm: 132, date: '1843-12-15' },
          { name: 'WATT', score: 21400, combo: 38, bpm: 120, date: '1776-03-08' },
          { name: 'VERNE', score: 17200, combo: 30, bpm: 108, date: '1870-06-20' },
          { name: 'EDISON', score: 12900, combo: 24, bpm: 96, date: '1879-10-22' }
        ];
      }

      saveLeaderboard() {
        localStorage.setItem('cw_leaderboard', JSON.stringify(this.leaderboard));
      }

      checkRankEligible(score) {
        const targetList = (this.globalLeaderboard && this.globalLeaderboard.length > 0)
          ? this.globalLeaderboard
          : this.leaderboard;
        if (targetList.length < 10) return true;
        return score > targetList[targetList.length - 1].score;
      }

      async addLeaderboardRecord(name, score, combo, bpm) {
        const today = new Date().toISOString().split('T')[0];
        const record = {
          name: name.toUpperCase().slice(0, 10) || 'PILOT',
          score,
          combo,
          bpm,
          date: today
        };

        // 1. 로컬 기록 저장
        this.leaderboard.push(record);
        this.leaderboard.sort((a, b) => b.score - a.score);
        if (this.leaderboard.length > 10) this.leaderboard.pop();
        this.saveLeaderboard();

        // 2. 글로벌 원격 저장소 동기화 전송
        await this.submitGlobalRecord(record);
      }

      initModals() {
        const rankingModal = document.getElementById('modal-ranking');
        const rankingBtn = document.getElementById('hud-btn-ranking');
        const closeRankingBtn = document.getElementById('btn-close-ranking');
        const tabGlobal = document.getElementById('tab-global-ranking');
        const tabLocal = document.getElementById('tab-local-ranking');

        const openRanking = () => {
          this.fetchGlobalLeaderboard();
          this.renderRankingList();
          rankingModal.style.display = 'flex';
        };
        const closeRanking = () => { rankingModal.style.display = 'none'; };

        if (rankingBtn) rankingBtn.addEventListener('click', openRanking);
        if (closeRankingBtn) closeRankingBtn.addEventListener('click', closeRanking);

        if (tabGlobal) {
          tabGlobal.addEventListener('click', () => {
            this.rankingTab = 'global';
            tabGlobal.classList.add('active');
            if (tabLocal) tabLocal.classList.remove('active');
            this.fetchGlobalLeaderboard();
            this.renderRankingList();
          });
        }

        if (tabLocal) {
          tabLocal.addEventListener('click', () => {
            this.rankingTab = 'local';
            tabLocal.classList.add('active');
            if (tabGlobal) tabGlobal.classList.remove('active');
            const statusEl = document.getElementById('ranking-status');
            if (statusEl) statusEl.innerText = '📱 THIS DEVICE ONLY (OFFLINE)';
            this.renderRankingList();
          });
        }

        const recordModal = document.getElementById('modal-newrecord');
        const submitRecordBtn = document.getElementById('btn-submit-record');
        const skipRecordBtn = document.getElementById('btn-skip-record');
        const inputCallsign = document.getElementById('input-callsign');

        if (submitRecordBtn) {
          submitRecordBtn.addEventListener('click', async () => {
            const name = inputCallsign.value.trim() || 'PILOT';
            localStorage.setItem('cw_last_callsign', name);
            recordModal.style.display = 'none';
            openRanking();
            await this.addLeaderboardRecord(name, this.score, this.maxCombo, this.maxReachedBpm);
            this.renderRankingList();
          });
        }

        if (skipRecordBtn) {
          skipRecordBtn.addEventListener('click', () => {
            recordModal.style.display = 'none';
          });
        }

        const skinsModal = document.getElementById('modal-skins');
        const skinsBtn = document.getElementById('hud-btn-skins');
        const closeSkinsBtn = document.getElementById('btn-close-skins');

        if (skinsBtn) {
          skinsBtn.addEventListener('click', () => {
            this.renderSkinsGrid();
            skinsModal.style.display = 'flex';
          });
        }
        if (closeSkinsBtn) closeSkinsBtn.addEventListener('click', () => { skinsModal.style.display = 'none'; });

        // 풀스크린 토글 버튼 (하단 힌트 바)
        const fsBtn = document.getElementById('hud-btn-fullscreen');
        if (fsBtn) {
          fsBtn.addEventListener('click', () => {
            this.toggleFullscreen();
          });
        }
      }

      toggleFullscreen() {
        const doc = document;
        const elem = document.documentElement;
        const isFS = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

        if (!isFS) {
          if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {});
          } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
          } else if (elem.mozRequestFullScreen) {
            elem.mozRequestFullScreen();
          } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
          }
        } else {
          if (doc.exitFullscreen) {
            doc.exitFullscreen().catch(() => {});
          } else if (doc.webkitExitFullscreen) {
            doc.webkitExitFullscreen();
          } else if (doc.mozCancelFullScreen) {
            doc.mozCancelFullScreen();
          } else if (doc.msExitFullscreen) {
            doc.msExitFullscreen();
          }
        }
      }

      renderRankingList() {
        const tbody = document.getElementById('ranking-list');
        tbody.innerHTML = '';
        const listToDisplay = (this.rankingTab === 'global')
          ? (this.globalLeaderboard && this.globalLeaderboard.length > 0 ? this.globalLeaderboard : this.leaderboard)
          : this.leaderboard;

        listToDisplay.forEach((rec, idx) => {
          const tr = document.createElement('tr');
          let rankClass = '';
          let rankBadge = `${idx + 1}`;
          if (idx === 0) { rankClass = 'rank-gold'; rankBadge = '🥇 1'; }
          else if (idx === 1) { rankClass = 'rank-silver'; rankBadge = '🥈 2'; }
          else if (idx === 2) { rankClass = 'rank-bronze'; rankBadge = '🥉 3'; }

          tr.innerHTML = `
            <td class="${rankClass}">${rankBadge}</td>
            <td style="font-weight:700; letter-spacing:1px; color:#ffd54f;">${rec.name}</td>
            <td style="color:#ffdf88; font-weight:900;">${rec.score.toLocaleString()}</td>
            <td>${rec.combo}x</td>
            <td style="color:#00e5ff;">${rec.bpm}</td>
            <td style="color:#8f7754; font-size:12px;">${rec.date}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      renderSkinsGrid() {
        const container = document.getElementById('skins-grid-container');
        container.innerHTML = '';
        SKINS.forEach(skin => {
          const isUnlocked = this.totalAccumScore >= skin.unlockScore;
          const isSelected = this.currentSkinId === skin.id;

          const card = document.createElement('div');
          card.className = `skin-card ${isSelected ? 'selected' : ''} ${!isUnlocked ? 'locked' : ''}`;
          card.innerHTML = `
            <div style="font-size:22px;">${skin.id === 'brass' ? '⚙️' : (skin.id === 'cyber' ? '⚡' : '🌌')}</div>
            <div class="skin-name" style="color:${skin.coreColor};">${skin.name}</div>
            <div class="skin-desc">${isUnlocked ? skin.desc : `🔒 UNLOCK AT ${skin.unlockScore.toLocaleString()} PTS`}</div>
          `;

          if (isUnlocked) {
            card.addEventListener('click', () => {
              this.currentSkinId = skin.id;
              localStorage.setItem('cw_selected_skin', skin.id);
              this.renderSkinsGrid();
            });
          }
          container.appendChild(card);
        });
      }

      openRankingModal() {
        const modal = document.getElementById('modal-ranking');
        if (modal.style.display === 'flex') {
          modal.style.display = 'none';
        } else {
          this.renderRankingList();
          modal.style.display = 'flex';
        }
      }

      openSkinsModal() {
        const modal = document.getElementById('modal-skins');
        if (modal.style.display === 'flex') {
          modal.style.display = 'none';
        } else {
          this.renderSkinsGrid();
          modal.style.display = 'flex';
        }
      }

      initEvents() {
        // 1. 키보드 이벤트
        window.addEventListener('keydown', (e) => {
          if (e.code === 'KeyR') {
            this.openRankingModal();
            return;
          }
          if (e.code === 'KeyS') {
            this.openSkinsModal();
            return;
          }
          if (e.code === 'Space') {
            e.preventDefault();
            if (!this.isKeyPressed) {
              this.isKeyPressed = true;
              this.handleActionInput();
            }
          } else if (e.code === 'Escape') {
            const rModal = document.getElementById('modal-ranking');
            const sModal = document.getElementById('modal-skins');
            if (rModal.style.display === 'flex' || sModal.style.display === 'flex') {
              rModal.style.display = 'none';
              sModal.style.display = 'none';
            } else {
              this.togglePause();
            }
          }
        });

        window.addEventListener('keyup', (e) => {
          if (e.code === 'Space') {
            this.isKeyPressed = false;
          }
        });

        // 2. 통합 포인터 & 터치 타격 핸들러 (모바일 지연 0ms)
        const handleInteraction = (clientX, clientY) => {
          const rect = this.canvas.getBoundingClientRect();
          const scaleX = 1280 / rect.width;
          const scaleY = 720 / rect.height;
          const clickX = (clientX - rect.left) * scaleX;
          const clickY = (clientY - rect.top) * scaleY;

          // 상단 우측 배지 버튼 클릭 처리
          if (clickY >= 10 && clickY <= 48) {
            // [⛶ FULLSCREEN] 버튼 (x: 940 ~ 1100)
            if (clickX >= 940 && clickX <= 1100) {
              this.toggleFullscreen();
              return;
            }
            // [🏆 RANKING] 버튼 (x: 1110 ~ 1265)
            if (clickX >= 1110 && clickX <= 1265) {
              this.openRankingModal();
              return;
            }
          }

          // 시작 / 게임오버 화면 중앙 버튼
          if (this.state === 'START' || this.state === 'GAMEOVER') {
            const by = this.state === 'START' ? (720 / 2 + 125) : (720 / 2 + 175);
            // 랭킹 버튼 (x: 440 ~ 620)
            if (clickX >= 440 && clickX <= 620 && clickY >= by && clickY <= by + 44) {
              this.openRankingModal();
              return;
            }
            // 스킨 버튼 (x: 660 ~ 840)
            if (clickX >= 660 && clickX <= 840 && clickY >= by && clickY <= by + 44) {
              this.openSkinsModal();
              return;
            }
          }

          this.handleActionInput();
        };

        // 마우스 클릭
        this.canvas.addEventListener('mousedown', (e) => {
          if (e.button === 0) {
            handleInteraction(e.clientX, e.clientY);
          }
        });

        // 📱 모바일 터치 이벤트 (원터치 즉각 반응)
        this.canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (e.touches.length > 0) {
            const touch = e.touches[0];
            handleInteraction(touch.clientX, touch.clientY);
          }
        }, { passive: false });
      }

      handleActionInput() {
        if (document.getElementById('modal-ranking').style.display === 'flex' ||
            document.getElementById('modal-newrecord').style.display === 'flex' ||
            document.getElementById('modal-skins').style.display === 'flex') {
          return;
        }

        this.audio.init();
        this.audio.resume();

        if (this.state === 'START') {
          this.startGame();
          return;
        }

        if (this.state === 'GAMEOVER') {
          this.resetGame();
          this.startGame();
          return;
        }

        if (this.state === 'PLAYING') {
          this.judgeHit();
        }
      }

      togglePause() {
        if (this.state === 'PLAYING') {
          this.state = 'PAUSED';
          this.audio.stopBgm();
        } else if (this.state === 'PAUSED') {
          this.state = 'PLAYING';
          this.audio.startBgm(this.currentBpm);
        }
      }

      startGame() {
        this.state = 'PLAYING';
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.lives = this.maxLives;
        this.currentBpm = this.baseBpm;
        this.maxReachedBpm = this.baseBpm;
        this.lastShiftCombo = 0;
        this.feverActive = false;
        this.feverTimeLeft = 0;
        this.noteQueue = [];
        this.particles = [];
        this.shockwaves = [];
        this.beatIndex = 0;

        const now = performance.now();
        this.gameStartTime = now;
        this.lastTime = now;
        this.nextBeatTime = now + (60000 / this.currentBpm);

        this.audio.startBgm(this.currentBpm);
      }

      resetGame() {
        this.noteQueue = [];
        this.particles = [];
        this.shockwaves = [];
        this.screenShakeTime = 0;
        this.missFlashAlpha = 0;
      }

      triggerFeverMode() {
        this.feverActive = true;
        this.feverTimeLeft = this.feverMaxTime;
        this.audio.playSteamBlast();
        triggerHaptic([60, 40, 80]); // 피버 햅틱
        this.triggerShake(16, 0.4);
        this.spawnSteamBurst(this.mainGear.x, this.mainGear.y, 40);
        this.shockwaves.push(new ShockwaveRing(this.mainGear.x, this.mainGear.y, '#ffd700', 360, 0.6));
        this.showTempoNotice('🔥 STEAM BURST FEVER! 2X SCORE! 🔥', '#ffeb3b');
      }

      checkDynamicTempoShift() {
        if (this.combo >= 8 && (this.combo - this.lastShiftCombo >= 8)) {
          this.lastShiftCombo = this.combo;

          let candidates = this.randomBpmPool.filter(bpm => bpm !== this.currentBpm);
          if (this.combo >= 24) {
            candidates.push(132, 142, 148);
          }
          const newBpm = candidates[Math.floor(Math.random() * candidates.length)];
          const isSpeedUp = newBpm > this.currentBpm;
          this.currentBpm = newBpm;

          if (this.currentBpm > this.maxReachedBpm) {
            this.maxReachedBpm = this.currentBpm;
          }

          this.audio.setBpm(this.currentBpm);
          this.audio.playGearShiftSound(isSpeedUp);
          triggerHaptic([40, 30, 60]); // 템포 시프트 햅틱

          this.triggerShake(14, 0.35);
          this.spawnSteamBurst(this.mainGear.x, this.mainGear.y, 35);
          this.shockwaves.push(new ShockwaveRing(
            this.mainGear.x, this.mainGear.y,
            isSpeedUp ? '#00e5ff' : '#ff9100',
            340, 0.6
          ));

          const shiftText = isSpeedUp
            ? `⚡ GEAR SHIFT! ${newBpm} BPM (ACCEL) ⚡`
            : `🌀 GEAR SHIFT! ${newBpm} BPM (SLOW) 🌀`;
          const shiftColor = isSpeedUp ? '#00ffff' : '#ff9900';
          this.showTempoNotice(shiftText, shiftColor);
        }
      }

      judgeHit() {
        const now = performance.now();
        let closestNote = null;
        let minDiff = Infinity;

        for (const note of this.noteQueue) {
          if (note.hit || note.missed) continue;
          const diff = now - note.targetTime;
          if (Math.abs(diff) < Math.abs(minDiff)) {
            minDiff = diff;
            closestNote = note;
          }
        }

        const skin = this.getCurrentSkin();
        const scoreMultiplier = this.feverActive ? 2 : 1;

        if (closestNote && Math.abs(minDiff) <= 160) {
          const absDiff = Math.abs(minDiff);

          if (absDiff <= 55) {
            // PERFECT
            closestNote.hit = true;
            this.combo++;
            if (this.combo > this.maxCombo) this.maxCombo = this.combo;
            this.score += (300 + this.combo * 25) * scoreMultiplier;
            this.mainGear.impactPulse = 1.0;
            this.comboPopScale = 1.45;

            triggerHaptic(25); // 퍼펙트 햅틱 진동

            this.audio.playMetalClank(true, skin.soundPitch);
            this.audio.playSteamBlast();
            this.triggerShake(8, 0.22);
            this.spawnHitEffects(closestNote, true);
            this.showJudgeFeedback(this.feverActive ? 'PERFECT x2!!' : 'PERFECT!!', '#ffd700');

            if (!this.feverActive && this.overdriveLevel >= 0.95 && this.combo >= 15) {
              this.triggerFeverMode();
            }

            this.checkDynamicTempoShift();
          } else if (absDiff <= 115) {
            // GOOD
            closestNote.hit = true;
            this.combo++;
            if (this.combo > this.maxCombo) this.maxCombo = this.combo;
            this.score += (150 + this.combo * 12) * scoreMultiplier;
            this.mainGear.impactPulse = 0.5;
            this.comboPopScale = 1.25;

            triggerHaptic(15); // 굿 햅틱 진동

            this.audio.playMetalClank(false, skin.soundPitch);
            this.triggerShake(4, 0.12);
            this.spawnHitEffects(closestNote, false);
            this.showJudgeFeedback(this.feverActive ? 'GOOD x2!' : 'GOOD!', '#ffb74d');

            if (!this.feverActive && this.overdriveLevel >= 0.95 && this.combo >= 15) {
              this.triggerFeverMode();
            }

            this.checkDynamicTempoShift();
          } else {
            this.handleMiss(closestNote, 'POOR TIMING');
          }
        } else {
          this.triggerShake(2, 0.05);
        }
      }

      handleMiss(note, reason = 'MISS') {
        if (note) note.missed = true;
        this.combo = 0;
        this.lastShiftCombo = 0;
        this.feverActive = false;
        this.lives--;

        triggerHaptic([40, 30, 40]); // 미스 피격 햅틱 진동

        this.audio.playMissScreech();
        this.missFlashAlpha = 0.7;
        this.triggerShake(14, 0.35);
        this.showJudgeFeedback(reason, '#ff3344');

        if (note) {
          const pos = note.getPosition(1.0, this.mainGear.x, this.mainGear.y, this.mainGear.radius);
          for (let i = 0; i < 12; i++) {
            const angle = Math.random() * Math.PI * 2;
            this.particles.push(new Particle(pos.x, pos.y, 'spark', '#ff3344', angle, 140 + Math.random() * 80, 0.35));
          }
        }

        if (this.lives <= 0) {
          this.triggerGameOver();
        }
      }

      triggerGameOver() {
        this.state = 'GAMEOVER';
        this.audio.stopBgm();
        this.audio.playCatastrophicFailure();
        triggerHaptic([100, 50, 150]); // 게임오버 햅틱
        this.triggerShake(26, 0.9);
        this.missFlashAlpha = 0.95;

        this.totalAccumScore += this.score;
        localStorage.setItem('cw_accum_score', String(this.totalAccumScore));

        if (this.score > this.highScore) {
          this.highScore = this.score;
          localStorage.setItem('cw_high_score', String(this.highScore));
        }
        if (this.maxCombo > this.highCombo) {
          this.highCombo = this.maxCombo;
          localStorage.setItem('cw_high_combo', String(this.highCombo));
        }
        if (this.maxReachedBpm > this.highBpm) {
          this.highBpm = this.maxReachedBpm;
          localStorage.setItem('cw_high_bpm', String(this.highBpm));
        }

        if (this.checkRankEligible(this.score)) {
          setTimeout(() => {
            const modal = document.getElementById('modal-newrecord');
            const summary = document.getElementById('record-summary-text');
            const input = document.getElementById('input-callsign');
            if (summary) summary.innerText = `SCORE: ${this.score.toLocaleString()} | MAX COMBO: ${this.maxCombo} | BPM: ${this.maxReachedBpm}`;
            if (input) input.value = localStorage.getItem('cw_last_callsign') || '';
            if (modal) modal.style.display = 'flex';
          }, 600);
        }

        for (let i = 0; i < 60; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 120 + Math.random() * 380;
          const theme = GEAR_THEMES[Math.floor(Math.random() * GEAR_THEMES.length)];
          this.particles.push(new Particle(this.mainGear.x, this.mainGear.y, 'debris', theme.mainColor, angle, speed, 1.5));
        }
        this.spawnSteamBurst(this.mainGear.x, this.mainGear.y, 45);
        this.shockwaves.push(new ShockwaveRing(this.mainGear.x, this.mainGear.y, '#ff1744', 380, 0.7));
      }

      triggerShake(intensity, duration) {
        this.screenShakeIntensity = intensity;
        this.screenShakeTime = duration;
      }

      spawnHitEffects(note, isPerfect) {
        const pos = note.getPosition(1.0, this.mainGear.x, this.mainGear.y, this.mainGear.radius);
        const theme = this.feverActive ? GEAR_THEMES[1] : GEAR_THEMES[note.themeIndex % GEAR_THEMES.length];

        const ringColor = isPerfect ? theme.rimGlow : '#ffb74d';
        this.shockwaves.push(new ShockwaveRing(pos.x, pos.y, ringColor, isPerfect ? 160 : 100, isPerfect ? 0.45 : 0.3));

        const count = isPerfect ? 24 : 12;
        for (let i = 0; i < count; i++) {
          const angle = pos.baseAngle + Math.PI + (Math.random() - 0.5) * Math.PI * 1.4;
          const speed = 140 + Math.random() * 280;
          const col = Math.random() > 0.4 ? theme.lightColor : '#ffffff';
          this.particles.push(new Particle(pos.x, pos.y, 'spark', col, angle, speed, 0.45 + Math.random() * 0.3));
        }

        for (let i = 0; i < 6; i++) {
          const angle = Math.random() * Math.PI * 2;
          this.particles.push(new Particle(pos.x, pos.y, 'steam', null, angle, 40 + Math.random() * 60, 0.7));
        }
      }

      spawnSteamBurst(x, y, count = 25) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 70 + Math.random() * 200;
          this.particles.push(new Particle(x, y, 'steam', null, angle, speed, 0.8 + Math.random() * 0.5));
        }
      }

      showJudgeFeedback(text, color) {
        this.judgePopup.text = text;
        this.judgePopup.color = color;
        this.judgePopup.scale = 1.6;
        this.judgePopup.alpha = 1.0;
      }

      showTempoNotice(text, color) {
        this.tempoPopup.text = text;
        this.tempoPopup.color = color;
        this.tempoPopup.scale = 1.5;
        this.tempoPopup.alpha = 1.0;
      }

      update(dt, now) {
        if (this.screenShakeTime > 0) {
          this.screenShakeTime -= dt;
        }

        if (this.missFlashAlpha > 0) {
          this.missFlashAlpha = Math.max(0, this.missFlashAlpha - dt * 2.5);
        }

        if (this.judgePopup.alpha > 0) {
          this.judgePopup.scale += (1.0 - this.judgePopup.scale) * dt * 8.0;
          this.judgePopup.alpha = Math.max(0, this.judgePopup.alpha - dt * 1.5);
        }

        if (this.tempoPopup.alpha > 0) {
          this.tempoPopup.scale += (1.0 - this.tempoPopup.scale) * dt * 6.0;
          this.tempoPopup.alpha = Math.max(0, this.tempoPopup.alpha - dt * 0.9);
        }

        if (this.comboPopScale > 1.0) {
          this.comboPopScale += (1.0 - this.comboPopScale) * dt * 9.0;
        }

        if (this.feverActive) {
          this.feverTimeLeft -= dt;
          if (this.feverTimeLeft <= 0) {
            this.feverActive = false;
            this.overdriveLevel = 0.5;
          }
        }

        this.audio.updateVisualizer(dt);

        const beatInterval = 60000 / this.currentBpm;
        const beatPhase = ((now - this.gameStartTime) % beatInterval) / beatInterval;
        this.mainGear.beatPulse = Math.max(0, Math.exp(-beatPhase * 6.5));

        const rotSpeed = (this.currentBpm / 60) * Math.PI * (this.feverActive ? 1.0 : 0.75);
        this.mainGear.rotation += rotSpeed * dt;
        if (this.mainGear.impactPulse > 0) {
          this.mainGear.impactPulse = Math.max(0, this.mainGear.impactPulse - dt * 4.5);
        }

        const targetPressure = Math.min(1.0, (this.currentBpm - 80) / 70 + (this.combo * 0.02));
        this.overdriveLevel += (targetPressure - this.overdriveLevel) * dt * 3.0;

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.update(dt);
          if (p.life <= 0) this.particles.splice(i, 1);
        }

        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.update(dt);
          if (sw.isDone()) this.shockwaves.splice(i, 1);
        }

        if (this.state !== 'PLAYING') return;

        const travelBeats = 3.5;
        const travelTime = travelBeats * beatInterval;
        const trajectories = ['RADIAL', 'SPIRAL_CW', 'SPIRAL_CCW', 'WAVE'];

        while (this.nextBeatTime <= now + travelTime) {
          const targetTime = this.nextBeatTime;
          const spawnTime = targetTime - travelTime;

          const angleIndex = (this.beatIndex * 3 + Math.floor(Math.random() * 3)) % 8;
          const trajectoryType = trajectories[this.beatIndex % trajectories.length];
          const themeIndex = this.feverActive ? 1 : (this.beatIndex % GEAR_THEMES.length);

          this.noteQueue.push(new ApproachGearNote(this.noteIdCounter++, targetTime, trajectoryType, angleIndex, spawnTime, themeIndex));

          this.nextBeatTime += beatInterval;
          this.beatIndex++;
        }

        for (let i = this.noteQueue.length - 1; i >= 0; i--) {
          const note = this.noteQueue[i];
          const progress = note.getProgress(now);

          if (progress >= 0 && progress <= 1.2 && !note.hit) {
            const pos = note.getPosition(progress, this.mainGear.x, this.mainGear.y, this.mainGear.radius);
            note.trail.push({ x: pos.x, y: pos.y });
            if (note.trail.length > 7) note.trail.shift();
          }

          if (now > note.targetTime + 260) {
            if (!note.hit && !note.missed) {
              this.handleMiss(note, 'MISSED!');
            }
            this.noteQueue.splice(i, 1);
          }
        }
      }

      draw() {
        const ctx = this.ctx;
        const width = 1280;
        const height = 720;

        ctx.save();

        if (this.screenShakeTime > 0) {
          const s = this.screenShakeIntensity * (this.screenShakeTime / 0.3);
          const offsetX = (Math.random() - 0.5) * s * 2;
          const offsetY = (Math.random() - 0.5) * s * 2;
          ctx.translate(offsetX, offsetY);
        }

        this.drawBackground(ctx, width, height);
        this.drawAudioVisualizer(ctx, width, height);
        this.drawOrbitTracks(ctx);
        this.drawApproachGears(ctx);
        this.drawMainCore(ctx);

        for (const sw of this.shockwaves) {
          sw.draw(ctx);
        }

        for (const p of this.particles) {
          p.draw(ctx);
        }

        this.drawArcadeHUD(ctx, width, height);

        if (this.feverActive) {
          ctx.save();
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 10;
          ctx.shadowColor = '#ffaa00';
          ctx.shadowBlur = 30;
          ctx.strokeRect(5, 5, width - 10, height - 10);
          ctx.restore();
        }

        if (this.missFlashAlpha > 0) {
          ctx.fillStyle = `rgba(255, 20, 40, ${this.missFlashAlpha})`;
          ctx.fillRect(0, 0, width, height);
        }

        this.drawStateOverlays(ctx, width, height);

        ctx.restore();
      }

      drawBackground(ctx, w, h) {
        const beatLight = this.mainGear.beatPulse * 0.09;
        const skin = this.getCurrentSkin();
        const bgGrad = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, 750);

        if (this.feverActive) {
          bgGrad.addColorStop(0, `rgba(80, 45, 10, ${0.9 + beatLight})`);
          bgGrad.addColorStop(0.5, '#2b1704');
          bgGrad.addColorStop(1, '#0e0600');
        } else if (skin.id === 'cyber') {
          bgGrad.addColorStop(0, `rgba(10, 45, 70, ${0.9 + beatLight})`);
          bgGrad.addColorStop(0.5, '#041724');
          bgGrad.addColorStop(1, '#01080f');
        } else if (skin.id === 'void') {
          bgGrad.addColorStop(0, `rgba(45, 10, 60, ${0.9 + beatLight})`);
          bgGrad.addColorStop(0.5, '#190322');
          bgGrad.addColorStop(1, '#08000c');
        } else {
          bgGrad.addColorStop(0, `rgba(55, 22, 75, ${0.9 + beatLight})`);
          bgGrad.addColorStop(0.5, '#13091e');
          bgGrad.addColorStop(1, '#050209');
        }

        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.globalAlpha = 0.07;
        drawCasualGear(ctx, 160, 160, 240, 32, this.mainGear.rotation * 0.3, skin.themeIndex);
        drawCasualGear(ctx, w - 160, h - 140, 280, 36, -this.mainGear.rotation * 0.25, 1);
        ctx.restore();

        ctx.strokeStyle = 'rgba(255, 180, 50, 0.05)';
        ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 50) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, h);
          ctx.stroke();
        }
        for (let y = 0; y < h; y += 50) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(this.mainGear.x, this.mainGear.y, 235, 0, Math.PI * 2);
        ctx.strokeStyle = this.feverActive ? 'rgba(255, 215, 0, 0.45)' : 'rgba(255, 180, 40, 0.18)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      drawAudioVisualizer(ctx, w, h) {
        ctx.save();
        const bars = this.audio.vuLevels;
        const barWidth = 6;
        const maxBarHeight = 110;
        const spacing = 12;

        for (let i = 0; i < bars.length; i++) {
          const level = bars[i];
          const barH = level * maxBarHeight;

          const lx = 25 + i * spacing;
          const ly = h - 60;
          ctx.fillStyle = this.feverActive ? '#ffd700' : (level > 0.8 ? '#ff1744' : '#00e5ff');
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 8;
          ctx.fillRect(lx, ly - barH, barWidth, barH);

          const rx = w - 25 - (bars.length - 1 - i) * spacing;
          ctx.fillRect(rx, ly - barH, barWidth, barH);
        }
        ctx.restore();
      }

      drawOrbitTracks(ctx) {
        const cx = this.mainGear.x;
        const cy = this.mainGear.y;
        const targetDist = this.mainGear.radius + 42 - 8;

        ctx.save();
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          const tx = cx + Math.cos(a) * targetDist;
          const ty = cy + Math.sin(a) * targetDist;

          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * 160, cy + Math.sin(a) * 160);
          ctx.lineTo(cx + Math.cos(a) * 600, cy + Math.sin(a) * 600);
          ctx.strokeStyle = this.feverActive ? 'rgba(255, 215, 0, 0.18)' : 'rgba(255, 200, 80, 0.08)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(tx, ty, 44, 0, Math.PI * 2);
          ctx.setLineDash([3, 4]);
          ctx.strokeStyle = this.feverActive ? 'rgba(255, 215, 0, 0.65)' : 'rgba(255, 215, 0, 0.35)';
          ctx.lineWidth = 1.8;
          ctx.stroke();
          ctx.setLineDash([]);

          ctx.beginPath();
          ctx.arc(tx, ty, 5, 0, Math.PI * 2);
          ctx.fillStyle = this.feverActive ? '#ffd700' : 'rgba(255, 200, 50, 0.6)';
          ctx.fill();
        }
        ctx.restore();
      }

      drawApproachGears(ctx) {
        const now = performance.now();
        const mg = this.mainGear;

        for (const note of this.noteQueue) {
          if (note.hit) continue;

          const progress = note.getProgress(now);
          if (progress < 0 || progress > 1.4) continue;

          const pos = note.getPosition(progress, mg.x, mg.y, mg.radius);
          const theme = this.feverActive ? GEAR_THEMES[1] : GEAR_THEMES[note.themeIndex % GEAR_THEMES.length];

          if (note.trail.length > 1) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(note.trail[0].x, note.trail[0].y);
            for (let t = 1; t < note.trail.length; t++) {
              ctx.lineTo(note.trail[t].x, note.trail[t].y);
            }
            ctx.strokeStyle = theme.rimGlow;
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = 8;
            ctx.shadowColor = theme.rimGlow;
            ctx.shadowBlur = 12;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();
          }

          const gearRatio = mg.teeth / note.teeth;
          const noteRotation = -(mg.rotation * gearRatio) + pos.angle;

          drawCasualGear(ctx, pos.x, pos.y, note.radius, note.teeth, noteRotation, this.feverActive ? 1 : note.themeIndex, false);

          if (progress < 1.0) {
            const shrinkRatio = 1.0 + (1.0 - progress) * 1.35;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, note.radius * shrinkRatio, 0, Math.PI * 2);
            ctx.strokeStyle = theme.lightColor;
            ctx.globalAlpha = Math.min(0.85, progress * 0.95);
            ctx.lineWidth = 2.2;
            ctx.shadowColor = theme.rimGlow;
            ctx.shadowBlur = 8;
            ctx.stroke();
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
          }
        }
      }

      drawMainCore(ctx) {
        const mg = this.mainGear;
        const skin = this.getCurrentSkin();
        const bounceScale = (1.0 + (mg.beatPulse * 0.08) + (mg.impactPulse * 0.06)) * (this.feverActive ? 1.08 : 1.0);

        ctx.save();
        ctx.translate(mg.x, mg.y);
        ctx.scale(bounceScale, bounceScale);
        ctx.translate(-mg.x, -mg.y);

        drawCasualGear(ctx, mg.x, mg.y, mg.radius, mg.teeth, mg.rotation, this.feverActive ? 1 : skin.themeIndex, true);

        if (this.overdriveLevel > 0.4 || this.feverActive) {
          const sparkCount = Math.floor((this.overdriveLevel + (this.feverActive ? 0.8 : 0)) * 5);
          ctx.strokeStyle = this.feverActive ? '#ffd700' : skin.coreColor;
          ctx.lineWidth = 2.5;
          ctx.shadowColor = ctx.strokeStyle;
          ctx.shadowBlur = 14;
          for (let s = 0; s < sparkCount; s++) {
            const a = Math.random() * Math.PI * 2;
            const r1 = mg.radius * 0.5;
            const r2 = mg.radius * (0.8 + Math.random() * 0.35);
            ctx.beginPath();
            ctx.moveTo(mg.x + Math.cos(a) * r1, mg.y + Math.sin(a) * r1);
            ctx.lineTo(mg.x + Math.cos(a + 0.2) * (r1 + r2) * 0.5, mg.y + Math.sin(a + 0.2) * (r1 + r2) * 0.5);
            ctx.lineTo(mg.x + Math.cos(a) * r2, mg.y + Math.sin(a) * r2);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      drawArcadeHUD(ctx, w, h) {
        ctx.save();

        this.drawCasualGauge(ctx, 130, 110, 75);

        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffb300';
        ctx.font = 'bold 15px "Chakra Petch", monospace';
        ctx.fillText('SCORE OVERDRIVE', w - 45, 40);

        ctx.fillStyle = this.feverActive ? '#ffd700' : '#ffffff';
        ctx.font = '900 38px "Orbitron", monospace';
        ctx.shadowColor = this.feverActive ? '#ffd700' : '#ff9900';
        ctx.shadowBlur = 14;
        ctx.fillText(String(this.score).padStart(7, '0'), w - 45, 78);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#ffca28';
        ctx.font = 'bold 14px "Chakra Petch", monospace';
        ctx.fillText(`BEST: ${String(Math.max(this.score, this.highScore)).padStart(7, '0')}`, w - 45, 102);

        ctx.fillStyle = '#00e5ff';
        ctx.font = 'bold 18px "Orbitron", monospace';
        ctx.fillText(`SPEED ${this.currentBpm} BPM`, w - 45, 128);

        // 피버 모드 남은 시간 바
        if (this.feverActive) {
          const feverProgress = this.feverTimeLeft / this.feverMaxTime;
          ctx.fillStyle = '#ff1744';
          ctx.fillRect(w / 2 - 120, 24, 240, 8);
          ctx.fillStyle = '#ffd700';
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 10;
          ctx.fillRect(w / 2 - 120, 24, 240 * feverProgress, 8);
          ctx.shadowBlur = 0;
          ctx.textAlign = 'center';
          ctx.font = '900 13px "Orbitron"';
          ctx.fillText(`🔥 FEVER ${this.feverTimeLeft.toFixed(1)}s 🔥`, w / 2, 44);
        }

        // 상단 우측 [ ⛶ FULLSCREEN ] 배지 버튼
        ctx.save();
        ctx.fillStyle = 'rgba(20, 30, 48, 0.85)';
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 1.8;
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.roundRect(w - 340, 12, 160, 32, [6]);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#b2ebf2';
        ctx.font = 'bold 13px "Orbitron", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 0;
        ctx.fillText('⛶ FULLSCREEN', w - 260, 33);

        // 상단 우측 [ 🏆 RANKING (R) ] 배지 버튼
        ctx.fillStyle = 'rgba(35, 18, 48, 0.85)';
        ctx.strokeStyle = '#ffd700';
        ctx.shadowColor = '#ffaa00';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.roundRect(w - 170, 12, 150, 32, [6]);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffe082';
        ctx.shadowBlur = 0;
        ctx.fillText('🏆 RANKING (R)', w - 95, 33);
        ctx.restore();

        // 콤보 팝
        if (this.combo > 0) {
          ctx.save();
          ctx.translate(w / 2, 85);
          ctx.scale(this.comboPopScale, this.comboPopScale);
          ctx.textAlign = 'center';
          ctx.fillStyle = this.feverActive ? '#ffd700' : '#ffe082';
          ctx.font = '900 44px "Orbitron", sans-serif';
          ctx.shadowColor = this.feverActive ? '#ffd700' : '#ff6f00';
          ctx.shadowBlur = 16;
          ctx.fillText(`${this.combo} COMBO`, 0, 0);
          ctx.restore();
        }

        // 판정 피드백
        if (this.judgePopup.alpha > 0) {
          ctx.save();
          ctx.translate(w / 2, 138);
          ctx.scale(this.judgePopup.scale, this.judgePopup.scale);
          ctx.textAlign = 'center';
          ctx.globalAlpha = this.judgePopup.alpha;
          ctx.fillStyle = this.judgePopup.color;
          ctx.font = '900 34px "Orbitron", sans-serif';
          ctx.shadowColor = this.judgePopup.color;
          ctx.shadowBlur = 18;
          ctx.fillText(this.judgePopup.text, 0, 0);
          ctx.restore();
        }

        // 템포 / 피버 배너
        if (this.tempoPopup.alpha > 0) {
          ctx.save();
          ctx.translate(w / 2, 185);
          ctx.scale(this.tempoPopup.scale, this.tempoPopup.scale);
          ctx.textAlign = 'center';
          ctx.globalAlpha = this.tempoPopup.alpha;
          ctx.fillStyle = this.tempoPopup.color;
          ctx.font = '900 24px "Orbitron", sans-serif';
          ctx.shadowColor = this.tempoPopup.color;
          ctx.shadowBlur = 20;
          ctx.fillText(this.tempoPopup.text, 0, 0);
          ctx.restore();
        }

        this.drawEnergyCores(ctx, w / 2, h - 55);

        ctx.restore();
      }

      drawCasualGauge(ctx, cx, cy, r) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        const rimGrad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
        rimGrad.addColorStop(0, this.feverActive ? '#fff176' : '#ffe082');
        rimGrad.addColorStop(0.5, this.feverActive ? '#ffb300' : '#ff8f00');
        rimGrad.addColorStop(1, '#3e1a00');
        ctx.fillStyle = rimGrad;
        ctx.fill();
        ctx.strokeStyle = '#180a02';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, r - 8, 0, Math.PI * 2);
        ctx.fillStyle = '#120818';
        ctx.fill();

        const startAng = Math.PI * 0.75;
        const endAng = Math.PI * 2.25;
        const ticks = 10;
        for (let i = 0; i <= ticks; i++) {
          const a = startAng + (i / ticks) * (endAng - startAng);
          const isRed = i >= 8;
          ctx.strokeStyle = isRed ? '#ff1744' : (this.feverActive ? '#ffd700' : '#00e5ff');
          ctx.lineWidth = isRed ? 3 : 1.8;

          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * (r - 22), cy + Math.sin(a) * (r - 22));
          ctx.lineTo(cx + Math.cos(a) * (r - 12), cy + Math.sin(a) * (r - 12));
          ctx.stroke();
        }

        ctx.textAlign = 'center';
        ctx.fillStyle = this.feverActive ? '#ffd700' : '#00e5ff';
        ctx.font = 'bold 10px "Chakra Petch"';
        ctx.fillText('PSI x100', cx, cy + 28);
        ctx.fillText(this.feverActive ? 'OVERHEAT!' : 'PRESSURE', cx, cy - 22);

        const needleAngle = startAng + Math.min(1.0, Math.max(0, this.overdriveLevel)) * (endAng - startAng);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(needleAngle);
        ctx.beginPath();
        ctx.moveTo(-3, 0);
        ctx.lineTo(0, -(r - 18));
        ctx.lineTo(3, 0);
        ctx.fillStyle = '#ff1744';
        ctx.shadowColor = '#ff1744';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.restore();

        ctx.restore();
      }

      drawEnergyCores(ctx, cx, cy) {
        ctx.save();
        const spacing = 52;
        const startX = cx - spacing;

        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffb74d';
        ctx.font = 'bold 12px "Chakra Petch", monospace';
        ctx.fillText('ENERGY CORES (LIVES)', cx, cy - 24);

        for (let i = 0; i < this.maxLives; i++) {
          const vx = startX + i * spacing;
          const isActive = i < this.lives;

          ctx.beginPath();
          ctx.arc(vx, cy, 15, 0, Math.PI * 2);
          if (isActive) {
            const grad = ctx.createRadialGradient(vx - 4, cy - 4, 1, vx, cy, 15);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.4, '#00e5ff');
            grad.addColorStop(1, '#005b82');
            ctx.fillStyle = grad;
            ctx.shadowColor = '#00e5ff';
            ctx.shadowBlur = 14;
          } else {
            ctx.fillStyle = '#1c1424';
            ctx.shadowBlur = 0;
          }
          ctx.fill();
          ctx.strokeStyle = isActive ? '#b2ebf2' : '#392d44';
          ctx.lineWidth = 2.2;
          ctx.stroke();
        }

        ctx.restore();
      }

      drawStateOverlays(ctx, w, h) {
        if (this.state === 'START') {
          ctx.fillStyle = 'rgba(6, 3, 10, 0.86)';
          ctx.fillRect(0, 0, w, h);

          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffd54f';
          ctx.font = '900 60px "Orbitron", sans-serif';
          ctx.shadowColor = '#ff6f00';
          ctx.shadowBlur = 25;
          ctx.fillText('CLOCKWORK OVERDRIVE', w / 2, h / 2 - 80);

          ctx.shadowBlur = 0;
          ctx.fillStyle = '#00e5ff';
          ctx.font = 'bold 22px "Chakra Petch", monospace';
          ctx.fillText('DYNAMIC TEMPO RHYTHM PRECISION', w / 2, h / 2 - 25);

          if (this.highScore > 0) {
            ctx.fillStyle = '#ffd54f';
            ctx.font = 'bold 18px "Orbitron", monospace';
            ctx.fillText(`ALL-TIME BEST: ${this.highScore} PTS | MAX COMBO: ${this.highCombo} | PEAK: ${this.highBpm} BPM`, w / 2, h / 2 + 15);
          }

          const pulse = (Math.sin(performance.now() * 0.006) + 1) * 0.5;
          ctx.fillStyle = `rgba(255, 238, 88, ${0.4 + pulse * 0.6})`;
          ctx.font = '900 26px "Orbitron", monospace';
          ctx.fillText(isMobile ? 'TAP SCREEN TO ENGAGE THE GEAR' : 'PRESS [SPACE] TO ENGAGE THE GEAR', w / 2, h / 2 + 75);

          // [🏆 랭킹 보기] 버튼
          const bStartY = h / 2 + 125;
          ctx.save();
          ctx.fillStyle = '#ffca28';
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#ffaa00';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.roundRect(440, bStartY, 180, 44, [8]);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#1a0e04';
          ctx.font = '900 14px "Orbitron", sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowBlur = 0;
          ctx.fillText('🏆 RANKING (R)', 530, bStartY + 27);

          // [🎨 스킨 선택] 버튼
          ctx.fillStyle = '#00e5ff';
          ctx.strokeStyle = '#fff';
          ctx.shadowColor = '#00e5ff';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.roundRect(660, bStartY, 180, 44, [8]);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#051824';
          ctx.shadowBlur = 0;
          ctx.fillText('🎨 SKINS (S)', 750, bStartY + 27);
          ctx.restore();

          ctx.fillStyle = '#ffb74d';
          ctx.font = '13px "Chakra Petch"';
          ctx.fillText(isMobile ? 'TAP BUTTONS FOR RANKING & SKINS' : 'CLICK BUTTONS OR PRESS [R] FOR RANKING • [S] FOR SKINS', w / 2, bStartY + 72);
        } else if (this.state === 'GAMEOVER') {
          ctx.fillStyle = 'rgba(10, 2, 6, 0.9)';
          ctx.fillRect(0, 0, w, h);

          ctx.textAlign = 'center';
          ctx.fillStyle = '#ff1744';
          ctx.font = '900 64px "Orbitron", sans-serif';
          ctx.shadowColor = '#ff1744';
          ctx.shadowBlur = 30;
          ctx.fillText('CORE MELTDOWN', w / 2, h / 2 - 110);

          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 26px "Orbitron", monospace';
          ctx.fillText(`FINAL SCORE: ${this.score}`, w / 2, h / 2 - 40);
          ctx.fillStyle = '#ffb300';
          ctx.fillText(`MAX COMBO: ${this.maxCombo}`, w / 2, h / 2 + 2);
          ctx.fillStyle = '#00e5ff';
          ctx.fillText(`PEAK SPEED: ${this.maxReachedBpm} BPM`, w / 2, h / 2 + 44);

          ctx.fillStyle = '#ffd54f';
          ctx.font = 'bold 18px "Orbitron", monospace';
          ctx.fillText(`[ALL-TIME BEST: ${this.highScore} PTS | MAX COMBO: ${this.highCombo}]`, w / 2, h / 2 + 82);

          const pulse = (Math.sin(performance.now() * 0.007) + 1) * 0.5;
          ctx.fillStyle = `rgba(255, 215, 64, ${0.4 + pulse * 0.6})`;
          ctx.font = '900 22px "Orbitron", monospace';
          ctx.fillText(isMobile ? 'TAP SCREEN TO REBOOT' : 'PRESS [SPACE] TO REBOOT', w / 2, h / 2 + 135);

          const bOverY = h / 2 + 175;
          ctx.save();
          ctx.fillStyle = '#ffca28';
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#ffaa00';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.roundRect(440, bOverY, 180, 44, [8]);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#1a0e04';
          ctx.font = '900 14px "Orbitron", sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowBlur = 0;
          ctx.fillText('🏆 RANKING (R)', 530, bOverY + 27);

          ctx.fillStyle = '#00e5ff';
          ctx.strokeStyle = '#fff';
          ctx.shadowColor = '#00e5ff';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.roundRect(660, bOverY, 180, 44, [8]);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#051824';
          ctx.shadowBlur = 0;
          ctx.fillText('🎨 SKINS (S)', 750, bOverY + 27);
          ctx.restore();
        } else if (this.state === 'PAUSED') {
          ctx.fillStyle = 'rgba(4, 2, 8, 0.78)';
          ctx.fillRect(0, 0, w, h);

          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffd54f';
          ctx.font = '900 48px "Orbitron", sans-serif';
          ctx.fillText('SYSTEM PAUSED', w / 2, h / 2);
          ctx.font = 'bold 20px "Chakra Petch"';
          ctx.fillStyle = '#00e5ff';
          ctx.fillText(isMobile ? 'TAP TO RESUME' : 'PRESS [ESC] TO RESUME', w / 2, h / 2 + 45);
        }
      }

      animate(now) {
        if (!this.lastTime) this.lastTime = now;
        const dt = Math.min(0.1, (now - this.lastTime) / 1000);
        this.lastTime = now;

        this.update(dt, now);
        this.draw();

        requestAnimationFrame(this.animate);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new ClockworkGame();
    });
  </script>
</body>
</html>
