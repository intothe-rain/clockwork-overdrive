<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>클락워크 오버드라이브 (Clockwork Overdrive)</title>
  
  <!-- 메타 태그 및 Open Graph (웹 배포 최적화) -->
  <meta name="description" content="스팀펑크 리듬 타이밍 게임 - 클락워크 오버드라이브. 8방향 소용돌이 기어, 피버 모드, 스킨 해금, 명예의 전당 랭킹을 정복하세요!">
  <meta property="og:title" content="클락워크 오버드라이브 (Clockwork Overdrive)">
  <meta property="og:description" content="웹 오디오 신디사이저와 8방향 나선 궤도가 어우러진 캐주얼 아케이드 스팀펑크 리듬 게임">
  <meta property="og:type" content="website">

  <!-- SVG 황동 기어 파비콘 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23b8860b' stroke='%23ffd700' stroke-width='6'/><circle cx='50' cy='50' r='18' fill='%23120818' stroke='%23ff9900' stroke-width='4'/><path d='M46,2 h8 v14 h-8 z M46,84 h8 v14 h-8 z M2,46 h14 v8 h-14 z M84,46 h14 v8 h-14 z M16,16 l6,6 l-6,6 l-6,-6 z M78,78 l6,6 l-6,6 l-6,-6 z M78,16 l6,-6 l6,6 l-6,6 z M16,78 l6,-6 l6,6 l-6,6 z' fill='%23ffd700'/></svg>">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Orbitron:wght@700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #06020a;
    }

    body {
      background: radial-gradient(circle at center, #22122b 0%, #0c0617 60%, #030107 100%);
      color: #ffde8a;
      font-family: 'Chakra Petch', 'Orbitron', 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-wrapper {
      position: relative;
      width: min(98vw, calc(95dvh * 16 / 9), calc(95vh * 16 / 9));
      height: min(calc(98vw * 9 / 16), 95dvh, 95vh);
      max-width: 100vw;
      max-height: 100dvh;
      box-shadow: 0 0 70px rgba(255, 110, 0, 0.3), 0 0 120px rgba(0, 0, 0, 0.98);
      border: 4px solid #663d16;
      border-radius: 12px;
      overflow: hidden;
      background-color: #0b0612;
      flex-shrink: 0;
    }

    /* 빛나는 황동 네온 프레임 */
    #game-wrapper::before {
      content: '';
      position: absolute;
      inset: 2px;
      border: 2px solid rgba(255, 210, 70, 0.5);
      border-radius: 10px;
      pointer-events: none;
      z-index: 10;
      box-shadow: inset 0 0 20px rgba(255, 150, 0, 0.25);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .retro-vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85);
      pointer-events: none;
      z-index: 11;
    }

    /* 📱 모바일 세로모드 회전 권장 오버레이 */
    #rotate-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 4, 14, 0.97);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: #ffd700;
    }

    .rotate-phone-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      animation: rotatePhone 2s infinite ease-in-out;
    }

    @keyframes rotatePhone {
      0%, 15% { transform: rotate(0deg); }
      50%, 75% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    .rotate-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffd54f;
      text-shadow: 0 0 15px #ff8f00;
      margin-bottom: 10px;
    }

    .rotate-desc {
      font-size: 14px;
      color: #b0bec5;
      line-height: 1.6;
    }

    /* 세로 모드(Portrait) 감지 시 회전 안내 표시 */
    @media screen and (orientation: portrait) and (max-width: 1024px) {
      #rotate-overlay {
        display: flex !important;
      }
    }

    /* UI 오버레이 모달 스타일 */
    .ui-modal {
      position: absolute;
      inset: 0;
      background: rgba(8, 4, 12, 0.88);
      backdrop-filter: blur(6px);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-box {
      width: 92%;
      max-width: 680px;
      max-height: 92%;
      overflow-y: auto;
      background: linear-gradient(135deg, #1f1126 0%, #100816 100%);
      border: 3px solid #ffb300;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(255, 170, 0, 0.4), inset 0 0 20px rgba(0,0,0,0.8);
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #ffd54f;
      text-shadow: 0 0 15px #ff8f00;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    /* 랭킹 모드 탭 */
    .ranking-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .tab-btn {
      background: rgba(30, 15, 40, 0.8);
      border: 1.5px solid #6b4423;
      color: #ffd54f;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #ffca28 0%, #b8730b 100%);
      color: #0b0612;
      border-color: #fff;
      box-shadow: 0 0 14px rgba(255, 200, 0, 0.5);
      font-weight: 900;
    }

    /* 랭킹 테이블 */
    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 16px 0;
      font-family: 'Chakra Petch', monospace;
      font-size: 14px;
    }

    .ranking-table th {
      color: #00e5ff;
      border-bottom: 2px solid #4a2f18;
      padding: 6px 4px;
      text-align: center;
      font-weight: 700;
    }

    .ranking-table td {
      padding: 6px 4px;
      border-bottom: 1px solid rgba(255, 200, 100, 0.1);
      text-align: center;
    }

    .rank-gold { color: #ffd700; font-weight: 900; text-shadow: 0 0 8px #ffb300; }
    .rank-silver { color: #e0e0e0; font-weight: 800; }
    .rank-bronze { color: #cd7f32; font-weight: 800; }

    /* 모달 버튼 */
    .btn-steampunk {
      background: linear-gradient(180deg, #ffca28 0%, #d48b1a 100%);
      border: 2px solid #fff;
      color: #1a0e04;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 14px;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
      box-shadow: 0 4px 0 #6e3f07, 0 0 15px rgba(255, 170, 0, 0.4);
      transition: all 0.12s ease;
      letter-spacing: 1px;
    }

    .btn-steampunk:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #6e3f07, 0 0 22px rgba(255, 200, 0, 0.6);
      filter: brightness(1.1);
    }

    .btn-steampunk:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #6e3f07;
    }

    .btn-secondary {
      background: linear-gradient(180deg, #37474f 0%, #212121 100%);
      border: 1px solid #78909c;
      color: #eceff1;
      box-shadow: 0 4px 0 #111;
      margin-left: 8px;
    }

    /* 닉네임 입력 폼 */
    .callsign-input {
      background: #09050d;
      border: 2px solid #00e5ff;
      border-radius: 6px;
      color: #00ffff;
      font-family: 'Orbitron', monospace;
      font-size: 20px;
      font-weight: 900;
      padding: 8px 14px;
      width: 220px;
      text-align: center;
      letter-spacing: 3px;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
      outline: none;
      margin: 12px 0 18px 0;
      text-transform: uppercase;
    }

    /* 스킨 선택 모달 */
    .skins-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 16px 0;
    }

    .skin-card {
      background: rgba(20, 10, 26, 0.7);
      border: 2px solid #4a3422;
      border-radius: 8px;
      padding: 12px 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .skin-card.selected {
      border-color: #ffd700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.45);
      background: rgba(45, 24, 60, 0.85);
    }

    .skin-card.locked {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }

    .skin-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 13px;
      margin-top: 6px;
    }

    .skin-desc {
      font-size: 10px;
      color: #b0bec5;
      margin-top: 3px;
    }

    .controls-hint {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #e5aa50;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 180, 0, 0.6);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .key-badge {
      background: #3e220e;
      border: 1px solid #e09f3e;
      border-radius: 4px;
      padding: 2px 10px;
      color: #fff0a8;
      box-shadow: 0 2px 0 #180a03;
    }

    .action-badge-btn {
      cursor: pointer;
      transition: transform 0.1s;
    }
    .action-badge-btn:hover {
      transform: scale(1.05);
      border-color: #ffd54f;
      color: #fff;
    }

    /* 📱 모바일 가로모드 (화면 높이가 낮거나 주소창이 떠있을 때) 최적화 */
    @media screen and (max-height: 540px) and (orientation: landscape) {
      body {
        padding: 0;
        justify-content: center;
      }
      #game-wrapper {
        width: min(100vw, calc(100dvh * 16 / 9), calc(100vh * 16 / 9));
        height: min(100dvh, 100vh, calc(100vw * 9 / 16));
        aspect-ratio: 16 / 9;
        border-radius: 0;
        border: none;
      }
      .controls-hint {
        display: none !important;
      }
      .modal-box {
        padding: 10px 14px;
        max-height: 96%;
      }
      .modal-title {
        font-size: 18px;
        margin-bottom: 6px;
      }
      .ranking-table th, .ranking-table td {
        padding: 2px 2px;
        font-size: 11px;
      }
      .skins-grid {
        gap: 6px;
        margin: 6px 0;
      }
      .skin-card {
        padding: 6px 4px;
      }
    }
  </style>
</head>
<body>

  <!-- 📱 모바일 세로 모드 회전 안내 화면 -->
  <div id="rotate-overlay">
    <svg class="rotate-phone-icon" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
      <path d="M12 18h.01"/>
      <path d="M19 12a7 7 0 0 0-7-7"/>
      <polyline points="12 1 12 5 16 5"/>
    </svg>
    <div class="rotate-title">ROTATE YOUR DEVICE</div>
    <div class="rotate-desc">
      클락워크 오버드라이브는 가로 화면에 최적화되어 있습니다.<br>
      스마트폰을 <strong>가로(Landscape)</strong>로 돌려주세요!
    </div>
  </div>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div class="retro-vignette"></div>

    <!-- 1. 명예의 전당 (Leaderboard) 모달 -->
    <div id="modal-ranking" class="ui-modal">
      <div class="modal-box">
        <h2 class="modal-title">🏆 HALL OF FAME 🏆</h2>
        <div class="ranking-tabs">
          <button class="tab-btn active" id="tab-global-ranking">🌐 GLOBAL WORLD</button>
          <button class="tab-btn" id="tab-local-ranking">📱 LOCAL DEVICE</button>
        </div>
        <div id="ranking-status" style="font-size:12px; color:#00e5ff; margin-bottom:6px; min-height:16px;"></div>
        <table class="ranking-table">
          <thead>
            <tr>
              <th>RANK</th>
              <th>CALLSIGN</th>
              <th>SCORE</th>
              <th>MAX COMBO</th>
              <th>PEAK BPM</th>
              <th>DATE</th>
            </tr>
          </thead>
          <tbody id="ranking-list">
            <!-- JS 동적 생성 -->
          </tbody>
        </table>
        <button class="btn-steampunk" id="btn-close-ranking">CLOSE</button>
      </div>
    </div>

    <!-- 2. 신기록 닉네임 입력 모달 -->
    <div id="modal-newrecord" class="ui-modal">
      <div class="modal-box">
        <h2 class="modal-title" style="color:#00e5ff; text-shadow:0 0 18px #00e5ff;">⚡ NEW HIGH SCORE! ⚡</h2>
        <p style="font-size:15px; color:#ffdf88;" id="record-summary-text">SCORE: 00000 | COMBO: 00</p>
        <div style="margin-top:10px; font-size:13px;">ENTER YOUR CALLSIGN:</div>
        <input type="text" id="input-callsign" class="callsign-input" maxlength="10" placeholder="PILOT" autofocus>
        <div>
          <button class="btn-steampunk" id="btn-submit-record">SAVE RECORD</button>
          <button class="btn-steampunk btn-secondary" id="btn-skip-record">SKIP</button>
        </div>
      </div>
    </div>

    <!-- 3. 워크샵 스킨 해금 모달 -->
    <div id="modal-skins" class="ui-modal">
      <div class="modal-box">
        <h2 class="modal-title">🎨 WORKSHOP SKINS 🎨</h2>
        <div class="skins-grid" id="skins-grid-container">
          <!-- JS 동적 생성 -->
        </div>
        <button class="btn-steampunk" id="btn-close-skins">CONFIRM</button>
      </div>
    </div>
  </div>

  <div class="controls-hint">
    <span class="key-badge" id="hint-input">SPACE or TAP</span> LOCK ON BEAT &bull; 
    <span class="key-badge action-badge-btn" id="hud-btn-ranking">🏆 RANKING</span> &bull; 
    <span class="key-badge action-badge-btn" id="hud-btn-skins">🎨 SKINS</span> &bull; 
    <span class="key-badge action-badge-btn" id="hud-btn-fullscreen">⛶ FULLSCREEN</span>
  </div>

  <script>
    /* ==========================================================================
       클락워크 오버드라이브 (Clockwork Overdrive)
       - 모바일 최적화: 가로모드 강제 오버레이, 전면 터치(Tap) 타격, 햅틱 진동 피드백
       - 명예의 전당 (Top 10 랭킹 시스템 & 닉네임 등록)
       - 오버드라이브 피버 모드 (Steam Burst Fever: 2x Score & Gold Overheat)
       - 워크샵 스킨 해금 시스템 (Brass / Cyber Neon / Void Overlord)
       - 반응형 오디오 비주얼라이저 (VU Meter)
       - 실시간 다이내믹 랜덤 BPM 변속 & 4코드 폴리포닉 BGM
       ========================================================================== */

    const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.innerWidth < 900;

    // 모바일 햅틱 진동 유틸리티
    function triggerHaptic(pattern) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch(e) {}
      }
    }

    // --- [1. 스킨 정의 (Workshop Skins)] ---
    const SKINS = [
      {
        id: 'brass',
        name: 'BRASS AUTOMATON',
        desc: 'Classic Steampunk Brass',
        unlockScore: 0,
        coreColor: '#ffd700',
        auraColor: 'rgba(255, 170, 0, 0.4)',
        themeIndex: 1,
        soundPitch: 1.0
      },
      {
        id: 'cyber',
        name: 'CYBER NEON',
        desc: 'Overclocked Cyberpunk Core',
        unlockScore: 8000,
        coreColor: '#00e5ff',
        auraColor: 'rgba(0, 229, 255, 0.5)',
        themeIndex: 2,
        soundPitch: 1.25
      },
      {
        id: 'void',
        name: 'VOID OVERLORD',
        desc: 'Dark Energy Singularity',
        unlockScore: 18000,
        coreColor: '#d500f9',
        auraColor: 'rgba(213, 0, 249, 0.5)',
        themeIndex: 4,
        soundPitch: 0.8
      }
    ];

    // --- [2. Web Audio API 엔진] ---
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.isInitialized = false;
        this.masterGain = null;
        this.noiseBuffer = null;

        this.bgmPlaying = false;
        this.bpm = 96;
        this.step = 0;
        this.bar = 0;
        this.nextNoteTime = 0;
        this.scheduleAheadTime = 0.12;
        this.timerId = null;

        this.vuLevels = [0, 0, 0, 0, 0, 0, 0, 0];

        this.chordProgression = [
          { bass: 55, notes: [110, 130.81, 164.81, 220] },
          { bass: 43.65, notes: [87.31, 110, 130.81, 174.61] },
          { bass: 65.41, notes: [130.81, 164.81, 196.00, 261.63] },
          { bass: 49.00, notes: [98.00, 123.47, 146.83, 196.00] }
        ];

        this.bassPattern = [
          0, 0, 12, 0, 7, 0, 10, 12,
          0, 0, 15, 12, 10, 0, 7, 5
        ];

        this.leadMelody = [
          [440, 0, 440, 523.25, 0, 659.25, 0, 587.33, 523.25, 0, 440, 0, 392, 440, 0, 0],
          [349.23, 0, 440, 0, 523.25, 0, 659.25, 587.33, 0, 523.25, 0, 440, 349.23, 0, 392, 0],
          [523.25, 0, 659.25, 0, 783.99, 0, 659.25, 0, 587.33, 523.25, 0, 392, 0, 440, 523.25, 0],
          [587.33, 0, 659.25, 587.33, 0, 523.25, 0, 440, 392, 0, 440, 0, 493.88, 523.25, 587.33, 0]
        ];
      }

      init() {
        if (this.isInitialized) return;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContextClass();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(0.75, this.ctx.currentTime);
        this.masterGain.connect(this.ctx.destination);

        this.generateNoiseBuffer();
        this.isInitialized = true;
      }

      resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      generateNoiseBuffer() {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
      }

      startBgm(bpm) {
        this.bpm = bpm;
        this.step = 0;
        this.bar = 0;
        if (!this.ctx) return;
        this.nextNoteTime = this.ctx.currentTime + 0.05;
        this.bgmPlaying = true;
        this.scheduler();
      }

      stopBgm() {
        this.bgmPlaying = false;
        if (this.timerId) clearTimeout(this.timerId);
      }

      setBpm(newBpm) {
        this.bpm = newBpm;
      }

      scheduler() {
        if (!this.bgmPlaying || !this.ctx) return;
        while (this.nextNoteTime < this.ctx.currentTime + this.scheduleAheadTime) {
          this.scheduleStep(this.step, this.bar, this.nextNoteTime);
          this.advanceStep();
        }
        this.timerId = setTimeout(() => this.scheduler(), 25);
      }

      advanceStep() {
        const secondsPerBeat = 60.0 / this.bpm;
        const isSwing = (this.step % 2 === 1);
        const swingRatio = isSwing ? 0.28 : 0.22;
        this.nextNoteTime += secondsPerBeat * swingRatio;

        this.step = (this.step + 1) % 16;
        if (this.step === 0) this.bar = (this.bar + 1) % 4;
      }

      scheduleStep(step, bar, time) {
        const chord = this.chordProgression[bar];

        if (step % 4 === 0 || step === 14) {
          this.playPunchKick(time, step === 14 ? 0.35 : 0.55);
          this.vuLevels[0] = 1.0;
          this.vuLevels[1] = 0.8;
        }

        if (step === 4 || step === 12) {
          this.playReverbSnare(time);
          this.vuLevels[4] = 1.0;
          this.vuLevels[5] = 0.9;
        }

        const isOpen = (step % 4 === 2);
        this.playSwingHiHat(time, isOpen, step % 2 === 0);
        this.vuLevels[6] = isOpen ? 0.85 : 0.5;
        this.vuLevels[7] = 0.65;

        if (step === 0 && bar === 0) {
          this.playSteamCrash(time);
          this.vuLevels.fill(1.0);
        }

        if (step === 0 || step === 6 || step === 12) {
          const duration = (step === 12) ? 0.35 : 0.6;
          this.playPolyChord(chord.notes, time, duration);
          this.vuLevels[3] = 0.75;
        }

        const noteOffset = this.bassPattern[step];
        if (noteOffset !== undefined) {
          const baseFreq = chord.bass;
          const freq = baseFreq * Math.pow(2, noteOffset / 12);
          this.playSlapBass(freq, time);
          this.vuLevels[2] = 0.9;
        }

        const leadFreq = this.leadMelody[bar][step];
        if (leadFreq > 0) {
          this.playLeadSynth(leadFreq, time);
        }
      }

      playPunchKick(time, vol = 0.55) {
        const click = this.ctx.createOscillator();
        const clickGain = this.ctx.createGain();
        click.type = 'triangle';
        click.frequency.setValueAtTime(450, time);
        click.frequency.exponentialRampToValueAtTime(80, time + 0.02);
        clickGain.gain.setValueAtTime(vol * 0.8, time);
        clickGain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);
        click.connect(clickGain);
        clickGain.connect(this.masterGain);
        click.start(time);
        click.stop(time + 0.03);

        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(145, time);
        sub.frequency.exponentialRampToValueAtTime(36, time + 0.16);
        subGain.gain.setValueAtTime(vol, time);
        subGain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
        sub.connect(subGain);
        subGain.connect(this.masterGain);
        sub.start(time);
        sub.stop(time + 0.19);
      }

      playReverbSnare(time) {
        [190, 330].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = idx === 0 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(f, time);
          osc.frequency.exponentialRampToValueAtTime(90, time + 0.09);
          g.gain.setValueAtTime(0.24, time);
          g.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
          osc.connect(g);
          g.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.11);
        });

        if (this.noiseBuffer) {
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(2400, time);
          filter.Q.setValueAtTime(1.8, time);

          const nGain = this.ctx.createGain();
          nGain.gain.setValueAtTime(0.35, time);
          nGain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);

          noise.connect(filter);
          filter.connect(nGain);
          nGain.connect(this.masterGain);
          noise.start(time);
          noise.stop(time + 0.23);
        }
      }

      playSwingHiHat(time, isOpen, isDownbeat) {
        if (!this.noiseBuffer) return;
        const dur = isOpen ? 0.14 : (isDownbeat ? 0.045 : 0.03);
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(isOpen ? 5500 : 7500, time);

        const gain = this.ctx.createGain();
        const vol = isOpen ? 0.18 : (isDownbeat ? 0.12 : 0.07);
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start(time);
        noise.stop(time + dur + 0.01);
      }

      playSteamCrash(time) {
        if (!this.noiseBuffer) return;
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(4500, time);
        filter.frequency.exponentialRampToValueAtTime(1200, time + 0.8);
        filter.Q.setValueAtTime(1.2, time);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.28, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.85);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start(time);
        noise.stop(time + 0.88);
      }

      playPolyChord(notes, time, duration) {
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          osc.type = 'sawtooth';
          const detune = (idx % 2 === 0 ? 5 : -5);
          osc.frequency.setValueAtTime(freq, time);
          osc.detune.setValueAtTime(detune, time);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2200, time);
          filter.frequency.exponentialRampToValueAtTime(650, time + duration);

          gain.gain.setValueAtTime(0.08, time);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          osc.start(time);
          osc.stop(time + duration + 0.02);
        });
      }

      playSlapBass(freq, time) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, time);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 6, time);
        filter.frequency.exponentialRampToValueAtTime(freq * 1.6, time + 0.14);
        filter.Q.setValueAtTime(5, time);

        gain.gain.setValueAtTime(0.22, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.16);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);

        osc.start(time);
        osc.stop(time + 0.17);
      }

      playLeadSynth(freq, time) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, time);

        gain.gain.setValueAtTime(0.13, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(time);
        osc.stop(time + 0.22);
      }

      playGearShiftSound(isSpeedUp = true) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;

        if (this.noiseBuffer) {
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(isSpeedUp ? 3800 : 1800, t);
          filter.Q.setValueAtTime(3, t);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          noise.start(t);
          noise.stop(t + 0.22);
        }

        const whistle = this.ctx.createOscillator();
        const wGain = this.ctx.createGain();
        whistle.type = 'triangle';
        if (isSpeedUp) {
          whistle.frequency.setValueAtTime(400, t);
          whistle.frequency.exponentialRampToValueAtTime(920, t + 0.3);
        } else {
          whistle.frequency.setValueAtTime(850, t);
          whistle.frequency.exponentialRampToValueAtTime(320, t + 0.3);
        }
        wGain.gain.setValueAtTime(0.25, t);
        wGain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

        whistle.connect(wGain);
        wGain.connect(this.masterGain);
        whistle.start(t);
        whistle.stop(t + 0.36);
      }

      playMetalClank(isPerfect = true, pitchMult = 1.0) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const freqs = (isPerfect ? [520, 960, 1720, 2600] : [380, 740, 1280]).map(f => f * pitchMult);

        freqs.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.82, t + 0.16);

          const vol = isPerfect ? (0.35 / (idx + 1)) : (0.2 / (idx + 1));
          gain.gain.setValueAtTime(vol, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(t);
          osc.stop(t + 0.25);
        });

        if (this.noiseBuffer) {
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.noiseBuffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(isPerfect ? 3400 : 2100, t);
          filter.Q.setValueAtTime(4, t);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(isPerfect ? 0.45 : 0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          noise.start(t);
          noise.stop(t + 0.1);
        }
      }

      playSteamBlast() {
        if (!this.ctx || !this.noiseBuffer) return;
        const t = this.ctx.currentTime;

        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(8000, t);
        filter.frequency.exponentialRampToValueAtTime(800, t + 0.4);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.48, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        noise.start(t);
        noise.stop(t + 0.44);

        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(140, t);
        sub.frequency.exponentialRampToValueAtTime(32, t + 0.3);

        subGain.gain.setValueAtTime(0.55, t);
        subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.32);

        sub.connect(subGain);
        subGain.connect(this.masterGain);
        sub.start(t);
        sub.stop(t + 0.34);
      }

      playMissScreech() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.linearRampToValueAtTime(70, t + 0.28);

        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);

        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(t);
        osc.stop(t + 0.32);
      }

      playCatastrophicFailure() {
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const boom = this.ctx.createOscillator();
        const boomGain = this.ctx.createGain();
        boom.type = 'triangle';
        boom.frequency.setValueAtTime(180, t);
        boom.frequency.exponentialRampToValueAtTime(16, t + 1.2);

        boomGain.gain.setValueAtTime(0.75, t);
        boomGain.gain.exponentialRampToValueAtTime(0.001, t + 1.25);

        boom.connect(boomGain);
        boomGain.connect(this.masterGain);
        boom.start(t);
        boom.stop(t + 1.3);
      }

      updateVisualizer(dt) {
        for (let i = 0; i < this.vuLevels.length; i++) {
          this.vuLevels[i] = Math.max(0, this.vuLevels[i] - dt * 3.5);
        }
      }
    }

    // --- [3. 파티클 시스템] ---
    class Particle {
      constructor(x, y, type, color, angle, speed, life) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.color = color;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = life;
        this.maxLife = life;
        this.size = type === 'steam' ? 14 : (type === 'debris' ? 8 + Math.random() * 8 : 4 + Math.random() * 4);
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.3;
      }

      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.rotation += this.vRot;
        this.life -= dt;

        if (this.type === 'spark') {
          this.vy += 180 * dt;
          this.vx *= 0.97;
        } else if (this.type === 'steam') {
          this.vy -= 45 * dt;
          this.size += 40 * dt;
          this.vx *= 0.95;
        } else if (this.type === 'debris') {
          this.vy += 380 * dt;
          this.vx *= 0.98;
        }
      }

      draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (this.type === 'spark') {
          ctx.globalAlpha = alpha;
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(0, 0, this.size * alpha, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'steam') {
          ctx.globalAlpha = alpha * 0.45;
          const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
          grad.addColorStop(0, 'rgba(255, 235, 210, 0.9)');
          grad.addColorStop(0.5, 'rgba(210, 160, 120, 0.5)');
          grad.addColorStop(1, 'rgba(100, 50, 20, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(0, 0, this.size, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.type === 'debris') {
          ctx.globalAlpha = alpha;
          ctx.fillStyle = this.color;
          ctx.strokeStyle = '#201008';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.rect(-this.size / 2, -this.size / 2, this.size, this.size);
          ctx.fill();
          ctx.stroke();
        }

        ctx.restore();
      }
    }

    class ShockwaveRing {
      constructor(x, y, color, maxRadius = 140, duration = 0.45) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.maxRadius = maxRadius;
        this.duration = duration;
        this.time = 0;
      }

      update(dt) {
        this.time += dt;
      }

      isDone() {
        return this.time >= this.duration;
      }

      draw(ctx) {
        const progress = this.time / this.duration;
        const currentRadius = progress * this.maxRadius;
        const alpha = Math.max(0, 1 - progress);

        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = 4 * (1 - progress * 0.5);
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.restore();
      }
    }

    // --- [4. 보석 기어 렌더링] ---
    const GEAR_THEMES = [
      { name: 'ruby', mainColor: '#ff2d55', lightColor: '#ff85a1', darkColor: '#6a001a', rimGlow: '#ff003c' },
      { name: 'gold', mainColor: '#ffb300', lightColor: '#ffe57f', darkColor: '#7c4300', rimGlow: '#ffaa00' },
      { name: 'sapphire', mainColor: '#00d2ff', lightColor: '#80eaff', darkColor: '#00477a', rimGlow: '#00c3ff' },
      { name: 'emerald', mainColor: '#00e676', lightColor: '#69f0ae', darkColor: '#00592e', rimGlow: '#00ff88' },
      { name: 'amethyst', mainColor: '#d500f9', lightColor: '#ea80fc', darkColor: '#4a0072', rimGlow: '#e040fb' }
    ];

    function drawCasualGear(ctx, x, y, radius, teeth, rotation, themeIndex = 1, isCore = false) {
      const theme = GEAR_THEMES[themeIndex % GEAR_THEMES.length];
      const toothHeight = isCore ? radius * 0.16 : radius * 0.22;
      const toothWidthAngle = (Math.PI * 2 / teeth) * 0.44;
      const innerRadius = radius - toothHeight;
      const hubRadius = radius * 0.38;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);

      ctx.beginPath();
      for (let i = 0; i < teeth; i++) {
        const a = (i / teeth) * Math.PI * 2;
        const a1 = a - toothWidthAngle / 2;
        const a2 = a + toothWidthAngle / 2;
        const a3 = a + (Math.PI / teeth) - toothWidthAngle / 2;

        if (i === 0) {
          ctx.moveTo(Math.cos(a1) * innerRadius, Math.sin(a1) * innerRadius);
        } else {
          ctx.lineTo(Math.cos(a1) * innerRadius, Math.sin(a1) * innerRadius);
        }
        ctx.lineTo(Math.cos(a1 + toothWidthAngle * 0.16) * (innerRadius + toothHeight), Math.sin(a1 + toothWidthAngle * 0.16) * (innerRadius + toothHeight));
        ctx.lineTo(Math.cos(a2 - toothWidthAngle * 0.16) * (innerRadius + toothHeight), Math.sin(a2 - toothWidthAngle * 0.16) * (innerRadius + toothHeight));
        ctx.lineTo(Math.cos(a2) * innerRadius, Math.sin(a2) * innerRadius);
        ctx.lineTo(Math.cos(a3) * innerRadius, Math.sin(a3) * innerRadius);
      }
      ctx.closePath();

      const grad = ctx.createRadialGradient(-radius * 0.25, -radius * 0.25, 4, 0, 0, radius + toothHeight);
      grad.addColorStop(0, theme.lightColor);
      grad.addColorStop(0.45, theme.mainColor);
      grad.addColorStop(0.85, theme.darkColor);
      grad.addColorStop(1, '#110508');

      ctx.fillStyle = grad;
      ctx.shadowColor = theme.rimGlow;
      ctx.shadowBlur = isCore ? 25 : 12;
      ctx.fill();

      ctx.strokeStyle = theme.lightColor;
      ctx.lineWidth = isCore ? 3 : 2;
      ctx.shadowBlur = 0;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, innerRadius * 0.82, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 1.8;
      ctx.stroke();

      const spokeCount = isCore ? 6 : 4;
      const spokeHoleR = innerRadius * 0.54;
      const holeSize = innerRadius * 0.17;
      for (let s = 0; s < spokeCount; s++) {
        const sa = (s / spokeCount) * Math.PI * 2;
        const hx = Math.cos(sa) * spokeHoleR;
        const hy = Math.sin(sa) * spokeHoleR;

        ctx.beginPath();
        ctx.arc(hx, hy, holeSize, 0, Math.PI * 2);
        ctx.fillStyle = '#08050e';
        ctx.fill();
        ctx.strokeStyle = theme.rimGlow;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(0, 0, hubRadius, 0, Math.PI * 2);
      const hubGrad = ctx.createRadialGradient(-hubRadius * 0.3, -hubRadius * 0.3, 1, 0, 0, hubRadius);
      hubGrad.addColorStop(0, '#ffffff');
      hubGrad.addColorStop(0.4, theme.lightColor);
      hubGrad.addColorStop(0.9, theme.darkColor);
      ctx.fillStyle = hubGrad;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, 0, hubRadius * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#0e0814';
      ctx.fill();

      ctx.restore();
    }

    // --- [5. 비트 노트 객체] ---
    class ApproachGearNote {
      constructor(id, targetTime, trajectoryType, angleIndex, spawnTime, themeIndex) {
        this.id = id;
        this.targetTime = targetTime;
        this.spawnTime = spawnTime;
        this.trajectoryType = trajectoryType;
        this.angleIndex = angleIndex;
        this.themeIndex = themeIndex;
        this.radius = 42;
        this.teeth = 10;
        this.hit = false;
        this.missed = false;
        this.trail = [];
      }

      getProgress(currentTime) {
        return (currentTime - this.spawnTime) / (this.targetTime - this.spawnTime);
      }

      getPosition(progress, centerX, centerY, mainRadius) {
        const baseAngle = (this.angleIndex / 8) * Math.PI * 2;
        const targetDistance = mainRadius + this.radius - 8;
        const startDistance = 750;

        let currentDist = startDistance + (targetDistance - startDistance) * progress;
        let currentAngle = baseAngle;

        if (this.trajectoryType === 'RADIAL') {
          currentAngle = baseAngle;
        } else if (this.trajectoryType === 'SPIRAL_CW') {
          const spiralRot = (1.0 - progress) * Math.PI * 2.2;
          currentAngle = baseAngle + spiralRot;
        } else if (this.trajectoryType === 'SPIRAL_CCW') {
          const spiralRot = (1.0 - progress) * Math.PI * 2.2;
          currentAngle = baseAngle - spiralRot;
        } else if (this.trajectoryType === 'WAVE') {
          const waveOffset = Math.sin(progress * Math.PI * 4) * 0.35 * (1.0 - progress);
          currentAngle = baseAngle + waveOffset;
        }

        const x = centerX + Math.cos(currentAngle) * currentDist;
        const y = centerY + Math.sin(currentAngle) * currentDist;
        const targetX = centerX + Math.cos(baseAngle) * targetDistance;
        const targetY = centerY + Math.sin(baseAngle) * targetDistance;

        return { x, y, angle: currentAngle, targetX, targetY, baseAngle, targetDistance };
      }
    }

    // --- [6. 메인 게임 컨트롤러] ---
    class ClockworkGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.audio = new AudioEngine();

        this.state = 'START';
        this.score = 0;
        this.combo = 0;
        this.maxCombo = 0;
        this.lives = 3;
        this.maxLives = 3;

        // 영구 로컬 스토리지
        this.highScore = parseInt(localStorage.getItem('cw_high_score') || '0', 10);
        this.highCombo = parseInt(localStorage.getItem('cw_high_combo') || '0', 10);
        this.highBpm = parseInt(localStorage.getItem('cw_high_bpm') || '96', 10);
        this.totalAccumScore = parseInt(localStorage.getItem('cw_accum_score') || '0', 10);
        this.currentSkinId = localStorage.getItem('cw_selected_skin') || 'brass';

        this.leaderboard = this.loadLeaderboard();
        this.globalLeaderboard = [];
        this.rankingTab = 'global';
        this.fetchGlobalLeaderboard();

        this.baseBpm = 96;
        this.currentBpm = 96;
        this.maxReachedBpm = 96;
        this.lastShiftCombo = 0;
        this.randomBpmPool = [86, 96, 108, 120, 132, 142];

        this.feverActive = false;
        this.feverTimeLeft = 0;
        this.feverMaxTime = 6.0;

        this.gameStartTime = 0;
        this.lastTime = 0;
        this.nextBeatTime = 0;
        this.beatIndex = 0;
        this.noteQueue = [];
        this.noteIdCounter = 0;

        this.mainGear = {
          x: 640,
          y: 360,
          radius: 120,
          teeth: 24,
          rotation: 0,
          impactPulse: 0,
          beatPulse: 0
        };

        this.particles = [];
        this.shockwaves = [];
        this.screenShakeTime = 0;
        this.screenShakeIntensity = 0;
        this.missFlashAlpha = 0;
        this.overdriveLevel = 0;

        this.judgePopup = { text: '', color: '#ffd700', scale: 1.0, alpha: 0 };
        this.tempoPopup = { text: '', color: '#00e5ff', scale: 1.0, alpha: 0 };
        this.comboPopScale = 1.0;

        this.isKeyPressed = false;

        this.initEvents();
        this.initModals();
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);

        // 모바일일 경우 힌트 텍스트 전환
        if (isMobile) {
          const hint = document.getElementById('hint-input');
          if (hint) hint.innerText = 'TAP SCREEN';
        }
